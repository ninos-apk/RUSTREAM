name: APK checks and tagged development releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: tagged-apk-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the app version and any pushed tag
        id: version
        run: |
          $tag = $env:RELEASE_TAG
          if (!$tag) {
            $source = Get-Content -Raw app/build.gradle.kts
            $version = [regex]::Match($source, '(?m)^\s*versionName\s*=\s*"([^"\r\n]+)"\s*$').Groups[1].Value
            if (!$version) { throw 'App version missing from source' }
            $tag = "v$version"
          }
          $tagPush = $env:RELEASE_TAG -ne ''
          $release = ./scripts/check-release-tag.ps1 -Tag $tag -RequireMain:$tagPush -CheckHistory:$tagPush
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "code=$($release.VersionCode)" >> $env:GITHUB_OUTPUT
          ./scripts/generate-release-notes.ps1 -Version $release.Version

      - name: Restore the development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64) { throw 'Configure the DEVELOPMENT_KEYSTORE_BASE64 repository secret before pushing a release tag. See docs/GITHUB_RELEASES.md.' }
          New-Item -ItemType Directory -Force .tools/android-user | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD '.tools/android-user/debug.keystore'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the release signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          $configured = @($env:RELEASE_KEYSTORE_BASE64, $env:RELEASE_KEY_ALIAS, $env:RELEASE_STORE_PASSWORD, $env:RELEASE_KEY_PASSWORD) | Where-Object { $_ }
          if ($configured.Count -gt 0 -and $configured.Count -ne 4) { throw 'Configure all four RELEASE signing secrets together.' }
          if ($env:RELEASE_KEYSTORE_BASE64) {
            if (!$env:RELEASE_KEY_ALIAS -or !$env:RELEASE_STORE_PASSWORD -or !$env:RELEASE_KEY_PASSWORD) { throw 'Configure all RELEASE signing secrets together.' }
            [IO.File]::WriteAllBytes((Join-Path $PWD '.tools/release-signing.keystore'), [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64))
          }

      - name: Install the Android SDK packages
        run: |
          $manager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          & $manager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE) { throw 'Android SDK setup failed' }
          "sdk.dir=$($env:ANDROID_HOME.Replace('\','/').Replace(':','\:'))" | Set-Content -Encoding utf8NoBOM local.properties

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { throw 'Rust setup failed' }
          rustup target add --toolchain 1.99.0-x86_64-pc-windows-msvc aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          if ($LASTEXITCODE) { throw 'Android Rust target setup failed' }

      - name: Check Rust and build the Android release
        run: |
          . ./scripts/env.ps1
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Rust formatting failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Rust lint failed' }
          cargo test --locked --workspace
          if ($LASTEXITCODE) { throw 'Rust tests failed' }
          ./gradlew.bat testDebugUnitTest lintDebug assembleRelease --console=plain
          if ($LASTEXITCODE) { throw 'Android build or checks failed' }

      - name: Sign and verify the APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          . ./scripts/env.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $apk = "artifacts/RUSTREAM-IPTV-PLAYER-$env:APP_VERSION.apk"
          $signer = "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat"
          $key = "$env:ANDROID_USER_HOME/debug.keystore"
          $alias = 'androiddebugkey'
          $env:UPDATE_STORE_PASSWORD = 'android'
          $env:UPDATE_KEY_PASSWORD = 'android'
          if ($env:RELEASE_KEYSTORE_BASE64) {
            $key = Join-Path $PWD '.tools/release-signing.keystore'
            $alias = $env:RELEASE_KEY_ALIAS
            $env:UPDATE_STORE_PASSWORD = $env:RELEASE_STORE_PASSWORD
            $env:UPDATE_KEY_PASSWORD = $env:RELEASE_KEY_PASSWORD
          }
          & $signer sign --ks $key --ks-key-alias $alias --ks-pass env:UPDATE_STORE_PASSWORD --key-pass env:UPDATE_KEY_PASSWORD --out $apk app/build/outputs/apk/release/app-release-unsigned.apk
          if ($LASTEXITCODE) { throw 'APK signing failed' }
          & $signer verify $apk
          if ($LASTEXITCODE) { throw 'APK signature verification failed' }
          $metadata = & "$env:ANDROID_HOME/build-tools/36.0.0/aapt.exe" dump badging $apk
          if ($LASTEXITCODE) { throw 'Cannot read APK metadata' }
          if ($metadata[0] -notmatch "versionName='$([regex]::Escape($env:APP_VERSION))'" -or $metadata[0] -notmatch "versionCode='$env:APP_VERSION_CODE'") { throw 'APK version does not match the tag/source' }
          ./scripts/verify-package.ps1 -Apk $apk
          if ($LASTEXITCODE) { throw 'APK alignment verification failed' }
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($apk))" | Set-Content -Encoding ascii "$apk.sha256"
          ./scripts/create-update-manifest.ps1 -Apk $apk -Keystore $key -Alias $alias
          if ($LASTEXITCODE) { throw 'Update metadata verification failed' }

      - name: Publish the tagged development prerelease
        if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $apk = "artifacts/RUSTREAM-IPTV-PLAYER-$env:APP_VERSION.apk"
          # Re-running a published version must not replace its original APK.
          gh release create $env:RELEASE_TAG $apk "$apk.sha256" artifacts/update.json artifacts/update.json.sig --draft --verify-tag --prerelease --latest=false --title "RUSTREAM IPTV PLAYER $env:APP_VERSION (development)" --generate-notes --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE) { throw 'Prerelease publishing failed; existing releases are never overwritten' }
          # Only expose the release to apps once all four assets have been uploaded.
          gh release edit $env:RELEASE_TAG --draft=false --latest=false
          if ($LASTEXITCODE) { throw 'Release remains a draft; inspect the failed run before retrying.' }

      - name: Remove the temporary signing key
        if: always()
        run: |
          $key = Join-Path $PWD '.tools/android-user/debug.keystore'
          if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          $releaseKey = Join-Path $PWD '.tools/release-signing.keystore'
          if (Test-Path -LiteralPath $releaseKey) { Remove-Item -LiteralPath $releaseKey -Force }
