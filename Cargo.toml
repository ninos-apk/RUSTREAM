[workspace]
members = ["crates/iptv-core", "crates/iptv-jni"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

